# 运行代理服务的用户和组
User nobody
Group nogroup

# 代理服务监听端口
Port 8888

# 【重要】访问控制：只允许你的 IP 地址连接
# 请将下面的示例 IP 替换为你自己的公网 IP，可添加多行以允许多个 IP
Allow ***.-.***.-.***.-.***

# 也可以允许一个网段，例如 Allow 192.168.1.0/24

# 日志记录
LogFile "/var/log/tinyproxy/tinyproxy.log"
LogLevel Info

# 最大客户端连接数
MaxClients 10

# 最小备用服务器进程数和最大进程数
MinSpareServers 2
MaxSpareServers 5

# 允许代理访问的 SSL 端口 (HTTPS)
ConnectPort 443
ConnectPort 563